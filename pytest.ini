[pytest]
# Las pruebas "vivo" salen a internet (lentas, dependen del sitio): no corren por defecto.
#   .\test.cmd           -> solo las de sin red
#   .\test.cmd -m vivo   -> solo las de humo contra los sitios reales
addopts = -m "not vivo"
markers =
    vivo: consulta los sitios reales para ver que siguen respondiendo como se espera
